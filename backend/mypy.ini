# Type checking for app/. The code is annotated throughout and until now nothing
# read a single annotation, which is the same shape as a typecheck that walks an
# empty file list: a gate that looks present and never runs.
#
# Deliberately not strict. The value here is catching a real mistake, not
# annotating every local; the settings below are the ones that would have caught
# something rather than the ones that would produce the longest list.
#
# tests/ is out of scope on purpose. A test asserts what the app does and reads
# rows off fixtures, and holding it to the app's contract would mostly produce
# noise about deliberately wrong inputs.
[mypy]
python_version = 3.12
files = app
# Third-party packages without stubs: Pillow, webpush and the rest. Their own
# typing is not this repo's to fix, and demanding it would only produce a wall
# of import errors that hides the app's own.
ignore_missing_imports = True
# The two that pay for themselves: a None reaching arithmetic or an attribute is
# what this checker actually found here.
strict_optional = True
warn_unreachable = True
