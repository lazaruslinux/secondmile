# Alembic configuration. The database URL is deliberately absent: migrations/
# env.py reads it from the same settings the app does, so the connection string
# lives in .env and never in a file that gets committed.

[alembic]
script_location = migrations
# Put the backend root on sys.path so env.py can import the app package.
prepend_sys_path = .
# Migration filenames read as 0002_add_something.py rather than a bare hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
