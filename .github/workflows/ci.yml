name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests and builds only read the checkout; the token gets no more than that.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # Two installs: production deps are hash-locked, dev deps are not, and
      # pip refuses to mix hashed and unhashed requirements in one command.
      # The video pipeline shells out to ffmpeg and ffprobe, so the test
      # machine needs them exactly as the backend image does. The video cases
      # build their own fixture clips with the same binaries.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Known-vulnerability gate over the installed (pinned) dependency set.
      # Pinned for the same reason ruff is: an unpinned gate fails CI on its
      # own schedule, not ours.
      - run: pip install pip-audit==2.10.1 && pip-audit

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Known-vulnerability gate over the production dependency tree.
      - run: npm audit --omit=dev
