<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Vale. Placeholder artwork, meant to be replaced.

  This file is the whole map. The app injects it as it is and only ever looks
  for the ids listed below, so every shape, colour, and label here can be
  redrawn in a vector editor without touching any code. See docs/03-artwork.md.

  Ids the code depends on:
    road-east_road, road-north_road, road-fell_road
      One <path> each. The marker is placed along these with
      getPointAtLength, so the path has to run from the road's start place to
      its end place, in that direction, and nothing else may carry the id.
        east_road   Homestead  -> Millbrook
        north_road  Millbrook  -> Fells Gate
        fell_road   Fells Gate -> The Shieling
    loc-homestead, loc-millbrook, loc-fells_gate, loc-shieling
      One element each. The centre of its bounding box is where the code puts
      the place's tap target and the marker when the player is standing there.
    gate-high_fells
      The shut gate. The code hides this element once the region is open.
    lake
      Art only. Kept as an id so it stays easy to find and replace.

  Everything is drawn with presentation attributes (fill="...", stroke="...")
  rather than style="..." or a <style> block, because the app's content
  security policy does not allow inline styles. If your editor writes style
  attributes, switch it to presentation attributes before saving.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">

  <!-- Ground -->
  <rect x="0" y="0" width="1200" height="800" fill="#f0e5cd"/>

  <!-- Valley meadows -->
  <g fill="#dfe4c0" stroke="#d3dab0" stroke-width="2">
    <ellipse cx="240" cy="520" rx="190" ry="130"/>
    <ellipse cx="470" cy="700" rx="230" ry="120"/>
    <ellipse cx="620" cy="480" rx="160" ry="110"/>
    <ellipse cx="120" cy="720" rx="150" ry="90"/>
  </g>

  <!-- Woodland, drawn as clumps rather than trees -->
  <g fill="#c3cfa6">
    <circle cx="380" cy="430" r="26"/>
    <circle cx="415" cy="455" r="20"/>
    <circle cx="350" cy="460" r="18"/>
    <circle cx="760" cy="700" r="24"/>
    <circle cx="795" cy="720" r="18"/>
    <circle cx="200" cy="330" r="22"/>
    <circle cx="235" cy="350" r="16"/>
  </g>

  <!-- The high fells, one region with a few hill marks -->
  <path
    d="M 620 340 C 640 240, 760 170, 880 200 C 960 130, 1120 150, 1180 240 C 1210 320, 1090 380, 960 360 C 830 390, 660 400, 620 340 Z"
    fill="#cdd3c2" stroke="#b6bda8" stroke-width="3"/>
  <g fill="none" stroke="#a9b199" stroke-width="3" stroke-linecap="round">
    <path d="M 700 300 q 18 -20 36 0"/>
    <path d="M 760 260 q 18 -20 36 0"/>
    <path d="M 840 300 q 18 -20 36 0"/>
    <path d="M 900 250 q 18 -20 36 0"/>
    <path d="M 980 300 q 18 -20 36 0"/>
    <path d="M 1040 250 q 18 -20 36 0"/>
  </g>

  <!-- Water -->
  <ellipse id="lake" cx="900" cy="620" rx="190" ry="110" fill="#a7c3d2" stroke="#86a7bb" stroke-width="3"/>
  <path d="M 330 380 C 360 470, 320 560, 355 720" fill="none" stroke="#a7c3d2" stroke-width="12" stroke-linecap="round"/>

  <!-- Roads. Direction matters: see the note at the top of this file. -->
  <g fill="none" stroke="#c4a373" stroke-width="9" stroke-linecap="round">
    <path id="road-east_road" d="M 170 660 C 280 700, 360 560, 520 560"/>
    <path id="road-north_road" d="M 520 560 C 560 470, 600 400, 700 330"/>
    <path id="road-fell_road" d="M 700 330 C 790 300, 880 250, 1010 215"/>
  </g>

  <!-- The footbridge on the East Road, where it crosses the brook -->
  <g stroke="#8a6a45" stroke-width="4" stroke-linecap="round">
    <path d="M 314 604 L 342 640"/>
    <path d="M 340 600 L 368 636"/>
  </g>

  <!-- The shut gate on the Fell Road -->
  <g id="gate-high_fells" transform="rotate(-20 738 316)">
    <rect x="716" y="292" width="9" height="48" fill="#6f5535"/>
    <rect x="751" y="292" width="9" height="48" fill="#6f5535"/>
    <rect x="712" y="296" width="52" height="9" fill="#6f5535"/>
    <rect x="712" y="320" width="52" height="7" fill="#6f5535"/>
  </g>

  <!-- Places. The anchor element carries the id; the rest is decoration. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="26" font-weight="600" fill="#4b3f30" text-anchor="middle">

    <path d="M 152 646 L 170 630 L 188 646 Z" fill="#7c5a35"/>
    <circle id="loc-homestead" cx="170" cy="660" r="13" fill="#fbf6ea" stroke="#7c5a35" stroke-width="5"/>
    <text x="170" y="710">Homestead</text>

    <rect x="496" y="530" width="16" height="16" fill="#7c5a35"/>
    <circle id="loc-millbrook" cx="520" cy="560" r="16" fill="#fbf6ea" stroke="#7c5a35" stroke-width="6"/>
    <text x="520" y="612">Millbrook</text>

    <circle id="loc-fells_gate" cx="700" cy="330" r="13" fill="#fbf6ea" stroke="#7c5a35" stroke-width="5"/>
    <text x="672" y="382">Fells Gate</text>

    <path d="M 992 196 L 1010 182 L 1028 196 Z" fill="#7c5a35"/>
    <circle id="loc-shieling" cx="1010" cy="215" r="13" fill="#fbf6ea" stroke="#7c5a35" stroke-width="5"/>
    <!-- Kept left of and below its circle so the app's zoom buttons, which
         sit over the top right corner of the frame, never cover it. -->
    <text x="940" y="300">The Shieling</text>
  </g>

  <!-- Area and road labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="22" fill="#6b5b46" text-anchor="middle">
    <text x="340" y="596" transform="rotate(-12 340 596)">East Road</text>
    <text x="588" y="452" transform="rotate(-52 588 452)">North Road</text>
    <text x="860" y="236" transform="rotate(-16 860 236)">Fell Road</text>
    <text x="900" y="628" font-size="26" fill="#4c6b7c">The Lake</text>
    <text x="890" y="150" font-size="26" fill="#5c6350">The High Fells</text>
  </g>
</svg>
