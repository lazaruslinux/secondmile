# Serves the built app and forwards /api to the backend container, so the
# browser only ever talks to one origin and the session cookie needs no CORS
# exception.

# What to tell the backend about the original scheme. An HTTPS-terminating
# reverse proxy in front of this container already sends X-Forwarded-Proto:
# https and that has to survive this hop; with nothing in front, our own scheme
# is the truth.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only text bodies are worth compressing here; the app ships no images.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both javascript MIME names: this nginx maps .js to application/javascript
    # while upstream has been moving to text/javascript, and a digest bump must
    # not quietly stop compressing the main bundle.
    gzip_types application/json application/javascript text/javascript text/css;

    # The app loads nothing from outside its own origin, so the policy can stay
    # strict rather than carving out exceptions for a CDN. worker-src covers
    # the map's tile worker, which is a file in our own build and so is served
    # by 'self'; blob: is allowed alongside it because maplibre starts that
    # same worker through a blob: URL whenever it decides the script is not
    # same-origin, and a map that will not draw is a poor way to find out.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The one endpoint that takes a file. Exact match, so it wins over the
    # /api/ prefix below without loosening the cap on anything else. The number
    # is a little above the server's own 5 MB limit on purpose: an oversized
    # upload should be refused by the application, which can explain itself in
    # JSON, rather than by nginx, which cannot.
    location = /api/profile/avatar {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # The sync endpoint. A phone's export carries per-workout sample arrays and
    # a first catch-up can cover years, so it needs room the rest of the API
    # does not. Exact match again, and the number matches the application's own
    # cap so both layers refuse at the same point.
    location = /api/ingest {
        client_max_body_size 15m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Attaching a photo to a workout. The id sits in the middle of the path, so
    # this one cannot be an exact match; a regex location beats the /api/ prefix
    # below whatever order they are written in, which is what lets an upload
    # through the 64k cap there. Eleven megabytes for the avatar block's reason:
    # a little above the application's own ten, so an oversized photo is refused
    # by the server, which can explain itself in JSON, rather than by nginx.
    location ~ ^/api/workouts/[0-9]+/photos$ {
        client_max_body_size 11m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Attaching a video to a workout. A regex location for the photo block's
    # reason, the id being in the middle of the path, and the same trick with
    # the number: 105 megabytes is a little above the application's own 100, so
    # an oversized video is refused by the server in JSON rather than by nginx
    # in HTML. The read timeout is raised because this is the one endpoint that
    # does real work before it answers: the upload is re-encoded inside the
    # request, which is seconds on a normal machine and longer on a slow one,
    # and nginx's 60 second default would call that a gateway error.
    location ~ ^/api/workouts/[0-9]+/videos$ {
        client_max_body_size 105m;
        proxy_read_timeout 180s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location /api/ {
        # API bodies are small JSON documents. A cap well under nginx's 1 MB
        # default means a junk upload is refused at the edge rather than being
        # read into the backend first.
        client_max_body_size 64k;
        # No URI after the host, so the path reaches the backend unchanged:
        # /api/auth/login stays /api/auth/login, which is where it lives.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the connecting address to whatever the header already said.
        # The backend reads the right-most entry, which is therefore the address
        # this container actually saw rather than anything a client claimed.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # nginx quirk: add_header is NOT inherited by a location that sets any
        # add_header of its own, so the security header set is repeated in
        # every location block below. It is repeated here too because a future
        # Cache-Control on this block would otherwise silently drop all five.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # The app shell must never be cached hard, or a phone keeps running the
    # previous build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Vite fingerprints these filenames, so their contents can never change
    # under the same name: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # The basemap archive, mounted rather than built in: one file of a size the
    # image has no business carrying, and optional besides. Byte ranges are
    # nginx's default behaviour for static files, which is the whole trick
    # here: the browser reads the few kilobytes it needs out of a file that may
    # run to gigabytes. An hour is long enough to stop a panned map re-asking
    # and short enough that swapping in wider coverage is seen the same day.
    location /tiles/ {
        alias /usr/share/nginx/tiles/;
        add_header Cache-Control "public, max-age=3600";
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location / {
        try_files $uri /index.html;
        # Repeated because add_header is not inherited into this location.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
